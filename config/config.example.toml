# config/config.toml にコピーして使う（config.toml は .gitignore 済み）
[app]
db_url = "sqlite:///data/mss2.db"
timezone = "Asia/Tokyo"
agg_interval_sec = 15.0
agg_timeframes = ["1m", "5m"]
# live エンジン（確定足 -> on_bar -> シグナル通知）を回す間隔（秒）。0 で無効。
live_interval_sec = 20.0

[notify]
# Slack Incoming Webhook URL。P2 でシグナル通知に使用。
slack_webhook_url = ""
# 通知を実際に送らずログ出力だけにする
dry_run = true

[paper]
# ペーパートレードの約定価格に乗せるスリッページ（bps）
slippage_bps = 3.0

[bridge]
# backend の受信エンドポイント（同一PCなら localhost）
ingest_url = "http://127.0.0.1:8000/api/ingest"
# 発注キューの受け渡し（P4）
orders_url = "http://127.0.0.1:8000/api/orders"
# xlwings で開く RSS ブック（build_workbook.py が生成）
workbook_path = "C:\\mss2-trader\\bridge\\rss_bridge.xlsx"
# 発注専用ブック（build_workbook.py --orders で1回だけ生成。空なら発注リレー無効）
orders_workbook_path = ""
poll_interval_sec = 2.0
# RssStockOrder のセルが確定するまで待つ秒数
order_resolve_timeout_sec = 15.0

[trading]
# false のままなら mode=live のシグナルは一切発注されない。true にしても
# さらに UI で ARMED にしないと発注しない（二重の安全弁）。
enabled = false
max_qty_per_order = 100
max_notional_per_order = 300000
daily_loss_limit = 30000
session_windows = ["09:00-11:30", "12:30-15:30"]
# RssStockOrder の口座区分: 0:特定 1:一般 2:NISA 3:旧NISA
default_account_type = "0"
