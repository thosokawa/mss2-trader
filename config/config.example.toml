# config/config.toml にコピーして使う（config.toml は .gitignore 済み）
[app]
db_url = "sqlite:///data/mss2.db"
timezone = "Asia/Tokyo"
agg_interval_sec = 15.0
agg_timeframes = ["1m", "5m"]

[notify]
# Slack Incoming Webhook URL。P2 でシグナル通知に使用。
slack_webhook_url = ""
# 通知を実際に送らずログ出力だけにする
dry_run = true

[bridge]
# backend の受信エンドポイント（同一PCなら localhost）
ingest_url = "http://127.0.0.1:8000/api/ingest"
# xlwings で開く RSS ブック（build_workbook.py が生成）
workbook_path = "C:\\mss2-trader\\bridge\\rss_bridge.xlsx"
poll_interval_sec = 2.0

[trading]
# P4 まで false。true でも各戦略の mode=live かつ UI で ARMED にしないと発注しない。
enabled = false
max_qty_per_order = 100
max_notional_per_order = 300000
daily_loss_limit = 30000
session_windows = ["09:00-11:30", "12:30-15:30"]
